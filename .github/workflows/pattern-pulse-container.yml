name: Pattern-Pulse Container

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pattern-pulse-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and push amd64 production image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/pattern-pulse/paperclip
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          version="$(git describe --tags --match 'v*' --long --dirty 2>/dev/null || true)"
          tag="$IMAGE:sha-${COMMIT}"
          docker buildx build \
            --platform linux/amd64 \
            --target production \
            --build-arg "PAPERCLIP_BUILD_VERSION=$version" \
            --build-arg "PAPERCLIP_BUILD_COMMIT=$COMMIT" \
            --build-arg "CLI_TOOLS_CACHE_EPOCH=$(date -u +%G-W%V)" \
            --tag "$tag" \
            --push \
            .
          digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'Published %s@%s\n' "$tag" "$digest"
